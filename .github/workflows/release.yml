name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (markdown)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" build twine

      - name: Lint
        run: ruff check

      - name: Unit tests
        run: pytest

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base-v1

      - name: Cache integration fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: integration-fixtures-${{ hashFiles('tests/integration/conftest.py') }}
          restore-keys: integration-fixtures-

      - name: Integration tests
        run: pytest tests/integration/ -v

      - name: Bump version
        run: sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' pyproject.toml

      - name: Build
        run: python -m build

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git tag v${{ inputs.version }}
          git push origin main
          git push origin v${{ inputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          echo "$RELEASE_NOTES" > /tmp/release-notes.md
          gh release create v${{ inputs.version }} \
            --title "v${{ inputs.version }}" \
            --notes-file /tmp/release-notes.md \
            dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
