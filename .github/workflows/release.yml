name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (markdown)'
        required: true
        type: string

jobs:
  run-tests:
    uses: ./.github/workflows/run-tests.yml

  release:
    needs: run-tests
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - run: /opt/homebrew/bin/python3.12 -m venv .venv

      - name: Install dependencies
        run: .venv/bin/pip install -e ".[dev]" build twine

      - name: Bump version
        run: sed -i '' 's/^version = ".*"/version = "${{ inputs.version }}"/' pyproject.toml

      - name: Build
        run: .venv/bin/python -m build

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git tag v${{ inputs.version }}
          git push origin main
          git push origin v${{ inputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          echo "$RELEASE_NOTES" > /tmp/release-notes.md
          gh release create v${{ inputs.version }} \
            --title "v${{ inputs.version }}" \
            --notes-file /tmp/release-notes.md \
            dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: .venv/bin/twine upload dist/*
