name: Run tests

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: pytest --tb=short -q

  integration:
    name: Integration tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Restore fixtures cache
        uses: actions/cache/restore@v4
        with:
          path: tests/fixtures
          key: integration-fixtures-${{ hashFiles('tests/integration/conftest.py') }}

      - name: Restore Whisper models cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/whisper
          key: whisper-models-tiny-base

      - name: Restore embedding model cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Prepare fixtures and models
        run: python tests/integration/prepare.py

      - name: Save fixtures cache
        uses: actions/cache/save@v4
        with:
          path: tests/fixtures
          key: integration-fixtures-${{ hashFiles('tests/integration/conftest.py') }}

      - name: Save Whisper models cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/whisper
          key: whisper-models-tiny-base

      - name: Save embedding model cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Run integration tests
        run: pytest tests/integration/ --tb=short -q -x --timeout=120 --no-cov
