name: Run tests

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: pytest --tb=short -q

  integration:
    name: Integration tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Prepare fixtures and models
        run: python tests/integration/prepare.py
      - name: Run integration tests
        run: pytest tests/integration/ --tb=short -q -x --timeout=120 --no-cov
