name: Run tests

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macOS
            runner: [self-hosted, macOS, ARM64]
          - os: Linux
            runner: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/ruff check
      - run: .venv/bin/pytest --tb=short -q

  integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macOS
            runner: [self-hosted, macOS, ARM64]
          - os: Linux
            runner: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      - name: Prepare fixtures and models
        run: .venv/bin/python tests/integration/prepare.py
      - name: Run integration tests (fast tier)
        run: .venv/bin/pytest tests/integration/ -m "integration and not slow" --tb=short -q -x --timeout=120 --no-cov
