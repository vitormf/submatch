name: Run tests

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: /opt/homebrew/bin/python3.12 -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/ruff check
      - run: .venv/bin/pytest --tb=short -q

  integration:
    name: Integration tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: /opt/homebrew/bin/python3.12 -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      - name: Prepare fixtures and models
        run: .venv/bin/python tests/integration/prepare.py
      - name: Run integration tests
        run: .venv/bin/pytest tests/integration/ --tb=short -q -x --timeout=120 --no-cov
