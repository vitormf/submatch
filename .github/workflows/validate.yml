name: Validate

on:
  workflow_dispatch:

jobs:
  run-tests:
    uses: ./.github/workflows/run-tests.yml

  integration-full:
    name: Integration tests (slow tier)
    needs: run-tests
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - run: /opt/homebrew/bin/python3.12 -m venv .venv
      - name: Install dependencies
        run: .venv/bin/pip install -e ".[dev]"
      - name: Prepare fixtures
        run: .venv/bin/python tests/integration/prepare.py
      - name: Run slow integration tests
        run: .venv/bin/pytest tests/integration/ -m "integration and slow" --tb=short -q -x --timeout=300 --no-cov

  local-tests:
    name: Local tests (real fixtures)
    needs: run-tests
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - run: /opt/homebrew/bin/python3.12 -m venv .venv
      - name: Install dependencies
        run: .venv/bin/pip install -e ".[dev]"
      - name: Run local tests
        env:
          SUBMATCH_LOCAL_FIXTURES: ${{ secrets.SUBMATCH_LOCAL_FIXTURES }}
        run: .venv/bin/pytest tests/local/ -v --tb=short --no-cov
