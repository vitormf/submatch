[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "submatch"
version = "0.1.0"
description = "Verify subtitle files match video audio content"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper>=20231117",
    "ffsubsync>=0.4.22",
    "langdetect>=1.0.9",
    "pysubs2>=1.6",
    "tqdm>=4.64",
    "sentence-transformers>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
submatch = "submatch.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=submatch --cov-report=term-missing --ignore=tests/integration"
markers = [
    "integration: requires network, real ffmpeg/whisper, and downloaded fixtures",
]
